<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adekam Tech Contact</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

body{
    background:#f5f7fb;
    color:#333;
}

/* HEADER */
header{
    background:#0f172a;
    color:#fff;
    padding:18px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

header h1{
    font-size:28px;
}

nav a{
    color:#fff;
    text-decoration:none;
    margin-left:20px;
    transition:0.3s;
}

nav a:hover{
    color:#38bdf8;
}

/* CONTACT SECTION */
.contact{
    padding:80px 8%;
}

.contact-container{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:40px;
    flex-wrap:wrap;
}

/* LEFT SIDE */
.contact-text{
    flex:1;
    animation:fadeIn 1s ease;
}

.contact-text h2{
    font-size:42px;
    margin-bottom:15px;
    color:#0f172a;
}

.contact-text p{
    margin-bottom:20px;
    color:#555;
}

.contact-text img{
    width:100%;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

/* RIGHT SIDE FORM */
.contact-form{
    flex:1;
    background:#fff;
    padding:35px;
    border-radius:20px;
    box-shadow:0 5px 15px rgba(0,0,0,0.08);
    animation:fadeIn 1.2s ease;
}

.contact-form form{
    display:flex;
    flex-direction:column;
}

.contact-form input,
.contact-form textarea{
    margin-bottom:15px;
    padding:14px;
    border:1px solid #ccc;
    border-radius:8px;
    outline:none;
    transition:0.3s;
}

.contact-form input:focus,
.contact-form textarea:focus{
    border-color:#38bdf8;
}

.contact-form button{
    padding:14px;
    border:none;
    background:#38bdf8;
    color:#fff;
    border-radius:8px;
    cursor:pointer;
    transition:0.3s;
    font-size:16px;
}

.contact-form button:hover{
    background:#0284c7;
    transform:translateY(-3px);
}

/* FOOTER */
footer{
    background:#020617;
    color:#fff;
    text-align:center;
    padding:20px;
    margin-top:40px;
}

/* ANIMATION */
@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* RESPONSIVE */
@media(max-width:768px){

    header{
        flex-direction:column;
        gap:15px;
    }

    .contact-container{
        flex-direction:column;
    }

    .contact-text{
        text-align:center;
    }

    .contact-text h2{
        font-size:35px;
    }
}

</style>
</head>

<body>

<!-- HEADER -->
<header>

    <h1>Adekam Tech</h1>

    <nav>
        <a href="client.html">Home</a>
        <a href="clientproject.html">About</a>
        <a href="clientcontact.html">Contact</a>
    </nav>

</header>

<!-- CONTACT SECTION -->
<section class="contact">

    <div class="contact-container">

        <!-- LEFT SIDE -->
        <div class="contact-text">

            <h2>Contact Adekam Tech</h2>

            <p>
                Ready to build a modern website for your business or brand?
                Reach out to Adekam Tech today and let’s create something amazing together.
            </p>

            <img src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?q=80&w=1200&auto=format&fit=crop" alt="Tech Workspace">

        </div>

        <!-- RIGHT SIDE -->
        <div class="contact-form">

            <form>

                <input type="text" placeholder="Full Name" required>

                <input type="email" placeholder="Email Address" required>

                <input type="tel" placeholder="Phone Number" required>

                <input type="text" placeholder="Location">

                <textarea rows="5" placeholder="Write Your Message"></textarea>

                <button type="submit">Send Message</button>

            </form>

        </div>

    </div>

</section>

<!-- FOOTER -->
<footer>
    <p>© 2026 Adekam Tech. All Rights Reserved.</p>
</footer>

</body>
</html>
